# BMA3 DSH bundle. One package, four modules: inbox/preset are active rows; self lives inside the preset; persona is legacy.
- insert:
    - id: bma3-inbox
      name: '@mosire/bma3-dsh'
      config:
        module: inbox
        baseUrl: http://127.0.0.1:46500
        inboxId: bma3
        tokenEnv: BMA3_INBOX_TOKEN
        autoStart: true

    # Legacy row: the persona now lives inside the BMA3 preset (module: self).
    # Keep it inert so profiles created with the old bundle cannot double-register
    # a complete system prompt.
    - id: bma3-persona
      name: '@mosire/bma3-dsh'
      disabled: true
      config:
        module: persona
        prompt: 你是 BMA3 的角色。

    - id: bma3-preset
      name: '@mosire/bma3-dsh'
      config:
        module: preset
