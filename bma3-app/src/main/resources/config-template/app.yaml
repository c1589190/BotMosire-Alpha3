dataDir: ./data

server:
  host: 127.0.0.1
  port: 8765
  mcpPath: /mcp
  tokenEnv: BMA3_MCP_TOKEN

qqconnect:
  accounts:
    - accountId: qq-main
      endpoint: ws://127.0.0.1:3001
      tokenEnv: LLBOT_ACCESS_TOKEN
      enabled: false

inbox:
  inboxId: bma3
  httpPort: 46500

webconnect:
  enabled: false
  binary: /snap/bin/chromium
  headless: true
  allowedHosts:
    - bilibili.com
    - www.bilibili.com
    - passport.bilibili.com
    - search.bilibili.com
    - space.bilibili.com

logging:
  level: INFO
  dir: logs
