dataDir: ./data

server:
  host: 127.0.0.1
  port: 8765
  mcpPath: /mcp
  tokenEnv: BMA3_MCP_TOKEN

qqconnect:
  accounts:
    - accountId: qq-main
      endpoint: ws://127.0.0.1:3001
      tokenEnv: LLBOT_ACCESS_TOKEN
      enabled: false
      # selfQq / selfName 可省：启动时用 get_login_info 自动学习
      # selfName: BotMosire
  send:
    maxTextChars: 3000   # 1..3000
    overflow: reject     # reject | split
  media:
    dir: ""                  # 空 = <dataDir>/downloads
    maxInlineBytes: 65536    # 文本装得下就直接回
    maxDownloadBytes: 33554432
    timeoutSeconds: 20

inbox:
  inboxId: bma3
  httpPort: 46500
  display:
    maxMessagesPerItem: 6   # 4..8
    maxItemsPerPanel: 6     # 4..8
    includeOmittedCount: true

# 分数 = 最具体的来源规则 + 命中的属性加分（加法）。
# < dropBelow: 丢弃（不落消息板）；>= immediateThreshold: 走 importantDelaySeconds，其余走 normalDelaySeconds。
# 一切都可以由 Agent 用 set_config 改。
weighting:
  immediateThreshold: 300
  dropBelow: -300
  maxPriority: 1000
  importantDelaySeconds: 1
  normalDelaySeconds: 30
  sourcePriority:
    "*": 0
    qq_private: 300
    qq_group: 200
    # qq_group/955432692: 350   # 更具体者胜
  attributes:
    qq_at_bot: 100
    qq_at_all: 20
    qq_at_other: 0
    qq_reply_to_bot: 100
    qq_self_name: 60
    qq_command: 100
    # qq_sender/132843233: 50
    # qq_name/管理: 40

webconnect:
  enabled: false
  binary: /snap/bin/chromium
  headless: true
  allowedHosts:
    - bilibili.com
    - www.bilibili.com
    - passport.bilibili.com
    - search.bilibili.com
    - space.bilibili.com

logging:
  level: INFO
  dir: logs
