dataDir: ./data

# 启动安全模式（D-062/D-064）。
# auth: token（默认）= 需要 Bearer；token 由 jar 生成到 <config 目录>/.bma3env（0600，幂等）。
# auth: none         = 跳过 Bearer 校验（仅回环；等价于命令行 --no-auth）。
# envFile            = 覆盖 .bma3env 的路径；留空即 <config 目录>/.bma3env。
security:
  auth: token
  envFile: ""

server:
  host: 127.0.0.1
  port: 8765
  mcpPath: /mcp
  tokenEnv: BMA3_MCP_TOKEN   # 已废弃：token 现由 .bma3env 的 MCP_TOKEN 提供（D-063）
  healthPort: 8766        # /healthz /readyz /watchdog；0=随机

qqconnect:
  accounts:
    - accountId: qq-main
      endpoint: ws://127.0.0.1:3001
      tokenEnv: LLBOT_ACCESS_TOKEN
      enabled: false
      # selfQq / selfName 可省：启动时用 get_login_info 自动学习
      # selfName: BotMosire
  send:
    maxTextChars: 3000   # 1..3000
    overflow: reject     # reject | split
  media:
    dir: ""                  # 空 = <dataDir>/downloads
    maxInlineBytes: 65536    # 文本装得下就直接回
    maxDownloadBytes: 33554432
    timeoutSeconds: 20

inbox:
  inboxId: bma3
  httpPort: 46500
  display:
    maxMessagesPerItem: 6   # 1..50
    maxItemsPerPanel: 6     # 1..50
    includeOmittedCount: true
    maxCharsPerItem: 1200   # 单条目注入字符上限；0=不限（不设总字符上限）
  push:
    # minPriority 已废弃/忽略：所有未被 weighting.dropBelow 丢弃的条目都会推送；
    # 低于 immediateThreshold 的走 normalDelaySeconds（默认 60s）批次。
    minPriority: -1000
    maxFirstPushDelaySeconds: 60  # open 条目首次推送硬上限；0=关闭
  dismiss:
    autoEnabled: false      # watchdog 维护任务自动清理低优先 backlog
    autoBelowPriority: 0
    autoAfterSeconds: 1800
    autoMaxPerRound: 200
  retention:
    maxAgeDays: 30          # 只清 ACKED
    maxItems: 5000

# 分数 = 最具体的来源规则 + 命中的属性加分（加法）。
# < dropBelow: 丢弃（不落消息板）；>= immediateThreshold: 走 importantDelaySeconds，其余走 normalDelaySeconds。
# 一切都可以由 Agent 用 set_config 改。
weighting:
  immediateThreshold: 300
  dropBelow: -300
  maxPriority: 1000
  importantDelaySeconds: 3
  normalDelaySeconds: 60
  sourcePriority:
    "*": 0
    qq_private: 300
    qq_group: 200
    # qq_group/955432692: 350   # 更具体者胜
  attributes:
    qq_at_bot: 100
    qq_at_all: 20
    qq_at_other: 0
    qq_reply_to_bot: 100
    qq_self_name: 60
    qq_command: 100
    # qq_person_id/132843233: 50   # 稳定 QQ 号；昵称搜索用 qq_search

webconnect:
  enabled: false
  binary: /snap/bin/chromium
  headless: true
  allowedHosts:
    - bilibili.com
    - www.bilibili.com
    - passport.bilibili.com
    - search.bilibili.com
    - space.bilibili.com

# 部署者报警：组件 DOWN 时用可用账号给这个 QQ 发私聊；空=关闭。
deployer:
  qq: ""
  enabled: false

# 服务监控与自愈。watchdog 依赖除 app 外所有 bma3 模块。
watchdog:
  enabled: true
  intervalSeconds: 10
  probeTimeoutMs: 2000
  failureThreshold: 2
  recoveryCooldownSeconds: 30
  alertCooldownSeconds: 600
  pluginHeartbeatTimeoutSeconds: 45
  diskMinFreeMb: 200
  readyzCritical: [mcp, inboxHttp, qqAccount, db]

logging:
  level: INFO
  dir: logs
